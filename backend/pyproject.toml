[project]
name = "c216-backend"
version = "0.1.0"
description = "Backend do projeto de C216."
authors = [
    {name = "Bianca Souza",email = "biancaribdesouza@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.1.4,<2.2.0)",
    "psycopg[binary] (>=3.3.6,<3.4.0)",
    "alembic (>=1.20.0,<1.21.0)",
    "pydantic-settings (>=2.16.0,<2.17.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: testes unitários (sem HTTP, isolam uma única camada)",
    "integration: testes de integração (dependem do PostgreSQL: API, repository e migrations)",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# A pasta local alembic/ faria o ruff tratar o pacote alembic como código do projeto.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
