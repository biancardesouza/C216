name: estoque

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque
    ports:
      # A porta do host pode ser trocada (DB_PORT) se a 5432 já estiver ocupada.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dados_estoque:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dados_estoque:
