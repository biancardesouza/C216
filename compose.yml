name: estoque

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque
    ports:
      # A porta do host pode ser trocada (DB_PORT) se a 5432 já estiver ocupada.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dados_estoque:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Dentro da rede do Compose, o banco é acessado pelo nome do serviço: db.
      DATABASE_URL: postgresql+psycopg://estoque:estoque@db:5432/estoque
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  dados_estoque:
